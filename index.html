<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>カーチェイス!</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: radial-gradient(ellipse at top, #232336, #14141f);
    color: #fff;
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    gap: 12px;
  }
  h1 { font-size: 22px; letter-spacing: 2px; text-shadow: 0 2px 8px rgba(0,0,0,.5); }
  canvas {
    border-radius: 8px;
    box-shadow: 0 12px 48px rgba(0,0,0,.7);
    touch-action: none;
  }
  #info { font-size: 13px; color: #99a; text-align: center; line-height: 1.6; }
</style>
</head>
<body>
<h1>🚗 カーチェイス! 🚓</h1>
<canvas id="game" width="420" height="640"></canvas>
<div id="info">← → / A D で移動、↑ ↓ で加速・減速(スマホはスワイプ)<br>
一般車にぶつかるとスピードダウン → パトカーに捕まったらゲームオーバー!</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// 道路設定
const ROAD_X = 64, ROAD_W = W - 128;
const LANES = 4;
const LANE_W = ROAD_W / LANES;

// ゲーム状態
let state = 'title'; // title | play | over
let keys = {};
let score = 0;
let best = +(localStorage.getItem('carChaseBest') || 0);
let frame = 0;

const player = { x: W/2, y: H - 170, w: 36, h: 64, speed: 0, vx: 0, tilt: 0 };
const police = { x: W/2, y: H + 80, w: 38, h: 66, tilt: 0 };
let traffic = [];
let particles = [];
let roadside = [];   // 街路樹・標識
let dashOffset = 0;
let texOffset = 0;
let shake = 0;
let policeGap = 260;

// ===== アスファルトのテクスチャを事前生成 =====
const TEX_H = 512;
const asphalt = document.createElement('canvas');
asphalt.width = ROAD_W; asphalt.height = TEX_H;
(function makeAsphalt() {
  const c = asphalt.getContext('2d');
  c.fillStyle = '#36363e';
  c.fillRect(0, 0, ROAD_W, TEX_H);
  // 粒状のざらつき
  for (let i = 0; i < 2600; i++) {
    const v = 40 + Math.random() * 40;
    c.fillStyle = `rgba(${v},${v},${v+6},${0.25 + Math.random()*0.3})`;
    c.fillRect(Math.random() * ROAD_W, Math.random() * TEX_H, 1.5, 1.5);
  }
  // ひび割れ
  for (let i = 0; i < 7; i++) {
    c.strokeStyle = 'rgba(20,20,24,.45)';
    c.lineWidth = 1;
    let x = Math.random() * ROAD_W, y = Math.random() * TEX_H;
    c.beginPath(); c.moveTo(x, y);
    for (let j = 0; j < 6; j++) {
      x += (Math.random() - 0.5) * 30; y += Math.random() * 24;
      c.lineTo(x, y);
    }
    c.stroke();
  }
  // 各車線のタイヤ痕(うっすら黒い2本筋)
  for (let l = 0; l < LANES; l++) {
    const cx = LANE_W * (l + 0.5);
    for (const off of [-11, 11]) {
      const g = c.createLinearGradient(cx + off - 5, 0, cx + off + 5, 0);
      g.addColorStop(0, 'rgba(0,0,0,0)');
      g.addColorStop(0.5, 'rgba(0,0,0,.22)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      c.fillStyle = g;
      c.fillRect(cx + off - 5, 0, 10, TEX_H);
    }
  }
})();

function reset() {
  score = 0; frame = 0;
  player.x = W/2; player.vx = 0; player.speed = 5;
  policeGap = 260;
  traffic = []; particles = [];
  shake = 0;
  roadside = [];
  for (let y = -40; y < H + 40; y += 90) spawnRoadside(y);
}

function spawnRoadside(y) {
  for (const side of [0, 1]) {
    if (Math.random() < 0.75) {
      roadside.push({
        side, y: y + (Math.random() - 0.5) * 30,
        type: Math.random() < 0.8 ? 'tree' : 'bush',
        size: 14 + Math.random() * 9,
        tone: Math.random(),
      });
    }
  }
}

// ===== 入力 =====
addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (e.key.startsWith('Arrow')) e.preventDefault();
  if (state !== 'play' && (e.key === ' ' || e.key === 'Enter')) {
    reset(); state = 'play';
  }
});
addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

let touchX = null;
canvas.addEventListener('touchstart', e => {
  if (state !== 'play') { reset(); state = 'play'; }
  touchX = e.touches[0].clientX;
});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const x = e.touches[0].clientX;
  player.x += (x - touchX) * 1.2;
  touchX = x;
}, { passive: false });
canvas.addEventListener('mousedown', () => {
  if (state !== 'play') { reset(); state = 'play'; }
});

// ===== ユーティリティ =====
function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.max(0, Math.min(255, (n >> 16) + amt));
  const g = Math.max(0, Math.min(255, ((n >> 8) & 255) + amt));
  const b = Math.max(0, Math.min(255, (n & 255) + amt));
  return `rgb(${r},${g},${b})`;
}

// ===== 車の描画(トップビュー・ディテール強化) =====
// type: 'player' | 'police' | 'sedan' | 'truck'
function drawCar(x, y, w, h, color, type, tilt = 0) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(tilt);

  // 落ち影
  ctx.fillStyle = 'rgba(0,0,0,.4)';
  ctx.beginPath();
  ctx.ellipse(2, 4, w * 0.62, h * 0.56, 0, 0, Math.PI * 2);
  ctx.fill();

  // タイヤ(ボディからわずかにはみ出す)
  ctx.fillStyle = '#0c0c0e';
  const ty = type === 'truck' ? [ -h*0.34, h*0.05, h*0.3 ] : [ -h*0.3, h*0.26 ];
  for (const yy of ty) {
    roundRect(ctx, -w/2 - 3, yy, 6, h*0.18, 2); ctx.fill();
    roundRect(ctx,  w/2 - 3, yy, 6, h*0.18, 2); ctx.fill();
  }

  // ボディ(先端をすぼめたシルエット)
  const bodyPath = () => {
    ctx.beginPath();
    ctx.moveTo(0, -h/2);
    ctx.quadraticCurveTo(w*0.5, -h/2, w/2, -h/2 + h*0.2);
    ctx.lineTo(w/2, h/2 - h*0.12);
    ctx.quadraticCurveTo(w/2, h/2, w*0.3, h/2);
    ctx.lineTo(-w*0.3, h/2);
    ctx.quadraticCurveTo(-w/2, h/2, -w/2, h/2 - h*0.12);
    ctx.lineTo(-w/2, -h/2 + h*0.2);
    ctx.quadraticCurveTo(-w*0.5, -h/2, 0, -h/2);
    ctx.closePath();
  };
  // 左右の縁を暗く、中央を明るく → 曲面の反射らしさ
  const g = ctx.createLinearGradient(-w/2, 0, w/2, 0);
  g.addColorStop(0, shade(color, -45));
  g.addColorStop(0.5, shade(color, 28));
  g.addColorStop(1, shade(color, -45));
  ctx.fillStyle = g;
  bodyPath(); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.45)';
  ctx.lineWidth = 1.2;
  bodyPath(); ctx.stroke();

  if (type === 'truck') {
    // 荷台(コンテナ)
    ctx.fillStyle = shade(color, -15);
    roundRect(ctx, -w/2 + 3, -h*0.16, w - 6, h*0.62, 3); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.4)';
    roundRect(ctx, -w/2 + 3, -h*0.16, w - 6, h*0.62, 3); ctx.stroke();
    // コンテナの縦リブ
    ctx.strokeStyle = 'rgba(0,0,0,.22)';
    for (let i = 1; i < 5; i++) {
      const yy = -h*0.16 + (h*0.62) * i / 5;
      ctx.beginPath(); ctx.moveTo(-w/2 + 4, yy); ctx.lineTo(w/2 - 4, yy); ctx.stroke();
    }
    // キャブの窓
    ctx.fillStyle = '#1d2b3a';
    roundRect(ctx, -w/2 + 5, -h/2 + h*0.16, w - 10, h*0.12, 3); ctx.fill();
  } else {
    // フロントガラス(台形)
    const wsTop = -h*0.27, wsBot = -h*0.1;
    const wg = ctx.createLinearGradient(0, wsTop, 0, wsBot);
    wg.addColorStop(0, '#9fc4e0');
    wg.addColorStop(1, '#27425c');
    ctx.fillStyle = wg;
    ctx.beginPath();
    ctx.moveTo(-w*0.34, wsTop);
    ctx.lineTo(w*0.34, wsTop);
    ctx.lineTo(w*0.4, wsBot);
    ctx.lineTo(-w*0.4, wsBot);
    ctx.closePath(); ctx.fill();

    // ルーフ
    ctx.fillStyle = shade(color, -12);
    roundRect(ctx, -w*0.4, -h*0.1, w*0.8, h*0.34, 4); ctx.fill();
    // ルーフのハイライト
    ctx.fillStyle = 'rgba(255,255,255,.10)';
    roundRect(ctx, -w*0.18, -h*0.1, w*0.36, h*0.34, 4); ctx.fill();

    // リアガラス
    ctx.fillStyle = '#1d2b3a';
    ctx.beginPath();
    ctx.moveTo(-w*0.38, h*0.26);
    ctx.lineTo(w*0.38, h*0.26);
    ctx.lineTo(w*0.32, h*0.38);
    ctx.lineTo(-w*0.32, h*0.38);
    ctx.closePath(); ctx.fill();

    // サイドミラー
    ctx.fillStyle = shade(color, -30);
    ctx.fillRect(-w/2 - 4, -h*0.2, 5, 4);
    ctx.fillRect(w/2 - 1, -h*0.2, 5, 4);
  }

  // ヘッドライト
  ctx.fillStyle = '#ffe9a8';
  roundRect(ctx, -w*0.38, -h/2 + 2, w*0.2, 5, 2); ctx.fill();
  roundRect(ctx,  w*0.18, -h/2 + 2, w*0.2, 5, 2); ctx.fill();
  // テールランプ
  ctx.fillStyle = '#d8202a';
  roundRect(ctx, -w*0.42, h/2 - 6, w*0.26, 4, 2); ctx.fill();
  roundRect(ctx,  w*0.16, h/2 - 6, w*0.26, 4, 2); ctx.fill();

  if (type === 'police') {
    // 白黒ツートン
    ctx.fillStyle = 'rgba(255,255,255,.88)';
    ctx.beginPath();
    ctx.moveTo(-w/2 + 2, -h*0.07);
    ctx.lineTo(w/2 - 2, -h*0.07);
    ctx.lineTo(w/2 - 2, h*0.3);
    ctx.lineTo(-w/2 + 2, h*0.3);
    ctx.closePath(); ctx.fill();
    // ルーフの赤色灯バー
    const blink = Math.floor(frame / 7) % 2 === 0;
    ctx.fillStyle = '#222';
    roundRect(ctx, -w*0.34, -h*0.02, w*0.68, 9, 3); ctx.fill();
    ctx.fillStyle = blink ? '#ff2233' : '#55121a';
    roundRect(ctx, -w*0.3, 0, w*0.26, 5, 2); ctx.fill();
    ctx.fillStyle = blink ? '#27246b' : '#2244ff';
    roundRect(ctx, w*0.04, 0, w*0.26, 5, 2); ctx.fill();
    // 点滅の光が路面に落ちる
    const lg = ctx.createRadialGradient(0, 0, 5, 0, 0, 70);
    lg.addColorStop(0, blink ? 'rgba(255,40,60,.30)' : 'rgba(50,80,255,.30)');
    lg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = lg;
    ctx.beginPath(); ctx.arc(0, 0, 70, 0, Math.PI * 2); ctx.fill();
  }

  ctx.restore();
}

// ===== 更新 =====
function update() {
  frame++;
  const difficulty = 1 + frame / 3600;

  const move = 6;
  if (keys['arrowleft'] || keys['a']) player.vx -= 1.2;
  if (keys['arrowright'] || keys['d']) player.vx += 1.2;
  player.vx *= 0.85;
  player.vx = Math.max(-move, Math.min(move, player.vx));
  player.x += player.vx;
  player.x = Math.max(ROAD_X + player.w/2, Math.min(ROAD_X + ROAD_W - player.w/2, player.x));
  player.tilt = player.vx * 0.035; // ハンドルを切ると車体が傾く

  const maxSpeed = 11 * difficulty;
  if (keys['arrowup'] || keys['w']) player.speed += 0.12;
  else if (keys['arrowdown'] || keys['s']) player.speed -= 0.25;
  else player.speed += 0.04;
  player.speed = Math.max(3, Math.min(maxSpeed, player.speed));

  score += player.speed / 10;
  dashOffset = (dashOffset + player.speed) % 48;
  texOffset = (texOffset + player.speed) % TEX_H;

  // 路肩オブジェクトのスクロール
  for (const r of roadside) r.y += player.speed;
  roadside = roadside.filter(r => r.y < H + 60);
  if (frame % Math.max(4, Math.round(90 / player.speed)) === 0) spawnRoadside(-50);

  // 一般車スポーン
  const spawnRate = Math.max(28, 70 - frame / 120);
  if (frame % Math.floor(spawnRate) === 0) {
    const lane = Math.floor(Math.random() * LANES);
    const truck = Math.random() < 0.18;
    traffic.push({
      x: ROAD_X + LANE_W * (lane + 0.5),
      y: truck ? -120 : -80,
      w: truck ? 40 : 34, h: truck ? 96 : 58,
      speed: 2 + Math.random() * 2.5,
      color: truck
        ? ['#c8cdd4','#5d7a99','#8a6f55'][Math.floor(Math.random()*3)]
        : ['#d9a521','#5fa83a','#7a4f9b','#d6d9dd','#1f7fa8','#aa3a30'][Math.floor(Math.random()*6)],
      type: truck ? 'truck' : 'sedan',
      hit: false,
    });
  }

  for (const t of traffic) {
    t.y += player.speed - t.speed;
    if (!t.hit &&
        Math.abs(t.x - player.x) < (t.w + player.w)/2 - 6 &&
        Math.abs(t.y - player.y) < (t.h + player.h)/2 - 6) {
      t.hit = true;
      player.speed = Math.max(3, player.speed * 0.45);
      policeGap -= 70;
      shake = 14;
      // 火花と破片
      for (let i = 0; i < 22; i++) {
        particles.push({
          x: (player.x + t.x)/2, y: (player.y + t.y)/2,
          vx: (Math.random()-0.5)*7, vy: (Math.random()-0.5)*7 + 2,
          life: 18 + Math.random()*14,
          color: Math.random() < 0.6 ? '#ffcc55' : '#ff8833',
        });
      }
    }
  }
  traffic = traffic.filter(t => t.y < H + 120);

  // 排気煙(低速時に濃く)
  if (frame % 4 === 0) {
    particles.push({
      x: player.x + (Math.random()-0.5)*10, y: player.y + player.h/2 + 4,
      vx: (Math.random()-0.5)*0.6, vy: 1.5 + Math.random(),
      life: 20, color: 'smoke',
    });
  }

  for (const p of particles) {
    p.x += p.vx; p.y += p.vy; p.life--;
    if (p.color !== 'smoke') p.vy += 0.15;
  }
  particles = particles.filter(p => p.life > 0);

  // パトカーAI
  const cruise = 7.5 * difficulty;
  policeGap += (player.speed - cruise) * 0.55;
  policeGap = Math.min(policeGap, 320);
  const prevX = police.x;
  police.x += (player.x - police.x) * 0.05;
  police.tilt = (police.x - prevX) * 0.03;
  police.y = player.y + Math.max(20, policeGap);

  if (policeGap < 55) {
    state = 'over';
    best = Math.max(best, Math.floor(score));
    localStorage.setItem('carChaseBest', best);
  }

  if (shake > 0) shake--;
}

// ===== 描画 =====
function draw() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);

  // 路肩の芝(グラデーション)
  const grass = ctx.createLinearGradient(0, 0, W, 0);
  grass.addColorStop(0, '#1e4d36');
  grass.addColorStop(0.15, '#2d6a4f');
  grass.addColorStop(0.85, '#2d6a4f');
  grass.addColorStop(1, '#1e4d36');
  ctx.fillStyle = grass;
  ctx.fillRect(-20, -20, W+40, H+40);

  // 街路樹・茂み(道路より下に描く)
  for (const r of roadside) {
    const x = r.side === 0 ? ROAD_X * 0.45 : W - ROAD_X * 0.45;
    if (r.type === 'tree') {
      ctx.fillStyle = 'rgba(0,0,0,.3)';
      ctx.beginPath(); ctx.ellipse(x+3, r.y+4, r.size, r.size*0.8, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = `hsl(${120 + r.tone*30}, 38%, ${24 + r.tone*10}%)`;
      ctx.beginPath(); ctx.arc(x, r.y, r.size, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = `hsl(${120 + r.tone*30}, 42%, ${32 + r.tone*10}%)`;
      ctx.beginPath(); ctx.arc(x - r.size*0.25, r.y - r.size*0.25, r.size*0.55, 0, Math.PI*2); ctx.fill();
    } else {
      ctx.fillStyle = `hsl(${100 + r.tone*30}, 35%, ${26 + r.tone*8}%)`;
      ctx.beginPath(); ctx.ellipse(x, r.y, r.size*0.9, r.size*0.55, 0, 0, Math.PI*2); ctx.fill();
    }
  }

  // アスファルト(テクスチャを2枚スクロール)
  ctx.drawImage(asphalt, ROAD_X, texOffset - TEX_H);
  ctx.drawImage(asphalt, ROAD_X, texOffset);
  ctx.drawImage(asphalt, ROAD_X, texOffset + TEX_H);

  // 路肩の縁石(白)
  ctx.fillStyle = '#d8d8d2';
  ctx.fillRect(ROAD_X - 4, -20, 6, H+40);
  ctx.fillRect(ROAD_X + ROAD_W - 2, -20, 6, H+40);

  // ガードレール(支柱がスクロール)
  ctx.fillStyle = '#9aa0a8';
  ctx.fillRect(ROAD_X - 14, -20, 4, H+40);
  ctx.fillRect(ROAD_X + ROAD_W + 10, -20, 4, H+40);
  ctx.fillStyle = '#777e88';
  for (let y = (texOffset % 64) - 64; y < H + 40; y += 64) {
    ctx.fillRect(ROAD_X - 16, y, 8, 5);
    ctx.fillRect(ROAD_X + ROAD_W + 8, y, 8, 5);
  }

  // 車線の破線
  ctx.strokeStyle = 'rgba(235,235,225,.7)';
  ctx.lineWidth = 4;
  ctx.setLineDash([24, 24]);
  ctx.lineDashOffset = -dashOffset;
  for (let i = 1; i < LANES; i++) {
    const x = ROAD_X + LANE_W * i;
    ctx.beginPath();
    ctx.moveTo(x, -20);
    ctx.lineTo(x, H + 20);
    ctx.stroke();
  }
  ctx.setLineDash([]);

  // スピード感のある流れ線
  if (state === 'play' && player.speed > 8) {
    ctx.strokeStyle = `rgba(255,255,255,${(player.speed - 8) * 0.03})`;
    ctx.lineWidth = 2;
    for (let i = 0; i < 6; i++) {
      const x = ROAD_X + ((i * 73 + frame * 5) % ROAD_W);
      const y = (i * 157 + frame * player.speed * 1.6) % (H + 80) - 40;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x, y + player.speed * 4);
      ctx.stroke();
    }
  }

  // 一般車
  for (const t of traffic) drawCar(t.x, t.y, t.w, t.h, t.hit ? '#6e6e72' : t.color, t.type);

  // パトカーと自車
  drawCar(police.x, police.y, police.w, police.h, '#15173d', 'police', police.tilt);
  drawCar(player.x, player.y, player.w, player.h, '#c81e2b', 'player', player.tilt);

  // パーティクル
  for (const p of particles) {
    if (p.color === 'smoke') {
      ctx.fillStyle = `rgba(160,160,165,${p.life / 80})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, (24 - p.life) * 0.35 + 2, 0, Math.PI*2); ctx.fill();
    } else {
      ctx.fillStyle = p.color;
      ctx.globalAlpha = Math.min(1, p.life / 12);
      ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3);
      ctx.globalAlpha = 1;
    }
  }

  ctx.restore();

  // HUD
  if (state !== 'title') {
    ctx.fillStyle = 'rgba(10,10,16,.55)';
    roundRect(ctx, 10, 10, 156, 64, 8); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(`SCORE ${Math.floor(score)}`, 20, 32);
    ctx.fillText(`SPEED ${Math.floor(player.speed * 20)} km/h`, 20, 56);

    const danger = Math.max(0, Math.min(1, 1 - (policeGap - 55) / 265));
    ctx.fillStyle = 'rgba(10,10,16,.55)';
    roundRect(ctx, W - 160, 10, 150, 40, 8); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = '12px sans-serif';
    ctx.fillText('🚓 接近度', W - 150, 26);
    ctx.fillStyle = '#333';
    ctx.fillRect(W - 150, 32, 130, 10);
    ctx.fillStyle = danger > 0.7 ? '#ff3344' : danger > 0.4 ? '#ffaa00' : '#44dd66';
    ctx.fillRect(W - 150, 32, 130 * danger, 10);
  }

  // タイトル / ゲームオーバー
  if (state !== 'play') {
    ctx.fillStyle = 'rgba(0,0,0,.65)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    const blink = Math.floor(Date.now() / 500) % 2 === 0;
    if (state === 'title') {
      ctx.font = 'bold 36px sans-serif';
      ctx.fillText('カーチェイス!', W/2, H/2 - 60);
      ctx.font = '16px sans-serif';
      ctx.fillText('パトカーから逃げきれ!', W/2, H/2 - 20);
      ctx.fillText('一般車にぶつかると減速して', W/2, H/2 + 10);
      ctx.fillText('パトカーに追いつかれるぞ', W/2, H/2 + 34);
      if (best > 0) ctx.fillText(`ベスト: ${best}`, W/2, H/2 + 60);
      ctx.font = 'bold 20px sans-serif';
      if (blink) ctx.fillText('スペースキー / タップ でスタート', W/2, H/2 + 100);
    } else {
      ctx.font = 'bold 38px sans-serif';
      ctx.fillStyle = '#ff5566';
      ctx.fillText('御用だ!!', W/2, H/2 - 50);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 22px sans-serif';
      ctx.fillText(`SCORE: ${Math.floor(score)}`, W/2, H/2);
      ctx.font = '16px sans-serif';
      ctx.fillText(`ベスト: ${best}`, W/2, H/2 + 30);
      ctx.font = 'bold 18px sans-serif';
      if (blink) ctx.fillText('スペースキー / タップ でリトライ', W/2, H/2 + 80);
    }
  }
}

function loop() {
  if (state === 'play') update();
  else frame++;
  draw();
  requestAnimationFrame(loop);
}
reset();
state = 'title';
loop();
</script>
</body>
</html>
